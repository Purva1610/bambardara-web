spring.application.name=demo
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/bambardara
spring.datasource.username=bambardara
spring.datasource.password=bambardara_dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Origins allowed to call /api/** (the React dev servers)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=abhayepay@gmail.com
spring.mail.password=gyeqcbvrpzsvqhez   

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Bail out instead of hanging the async mail thread on an unresponsive SMTP host
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT signing. Dev-only value: replace with an environment variable before
# deploying, and rotating it invalidates every token already issued.
# Must be Base64 and at least 32 bytes once decoded, or startup fails.
app.jwt.secret=UUcxK/BUhE1pZDcILTyjn4bFzcSWUS9WdTJ6WR25bozfGz3iHvNEi7EbAwgNIh/z2V7FCvZ9ArySjjNsW29BlA==
app.jwt.expiry-minutes=1440

# Contact-us notifications
# Gmail rewrites the From header to the authenticated account, so keep these
# in sync with spring.mail.username.
app.mail.from=abhayepay@gmail.com
# Comma-separated; every address here is notified about a new concern.
app.mail.marketing-team=abhayepay@gmail.com

# Keycloak / OAuth2 Resource Server
# Left blank to run without Keycloak configured - KeycloakResourceServerConfig
# reads this same property itself and simply does not build a JwtDecoder when
# it is empty, so leaving it unset does not affect application startup or the
# legacy-JWT authentication path.
# spring-boot-autoconfigure's own OAuth2ResourceServerAutoConfiguration is
# excluded in BambardaraBackendApplication precisely because it would try to
# eagerly build a JwtDecoder from this property (even when blank) and fail
# application startup; see that class for details.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:}

# Keycloak Admin API credentials, used only by KeycloakAdminService to create
# a user's Keycloak identity during POST /api/auth/register (client-credentials
# grant against the bambardara-api client's own service account). Never sent
# to the frontend. Dev-only default matches keycloak/realm-export/bambardara-realm.json;
# override via env vars for any other environment.
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:bambardara-api}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:bambardara-api-dev-secret-CHANGE-ME}