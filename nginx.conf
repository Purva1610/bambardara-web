server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ─── Security Headers ──────────────────────────────────────────────────────
  # Prevent the page from being embedded in iframes on other sites (clickjacking)
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Stop browsers from guessing MIME types (MIME-sniffing attacks)
  add_header X-Content-Type-Options "nosniff" always;

  # Only send the origin (no path) as Referer to third-party sites
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Restrict browser features not needed by the app
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Force HTTPS for 1 year once the site is behind SSL/TLS.
  # preload: eligible to be included in browsers' HSTS preload list.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Content-Security-Policy:
  #  - default-src 'self'               → only load resources from our own origin
  #  - script-src 'self' 'unsafe-inline'→ CRA inlines a small runtime chunk; tighten once migrated to Vite
  #  - style-src 'self' 'unsafe-inline' → Tailwind + emotion style injection
  #  - img-src 'self' data: blob:       → base64 data-URIs and blob object-URLs
  #  - font-src 'self' data:
  #  - connect-src: Firebase SDK + Auth REST API (identitytoolkit) + Storage
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.firebase.com https://*.firebaseapp.com https://*.firebaseio.com https://*.googleapis.com https://firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; frame-ancestors 'none';" always;
  # ───────────────────────────────────────────────────────────────────────────

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed JS/CSS bundles — immutable, cache forever
  location ~* \.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Images and other static media — cache for 1 year
  location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff2|woff|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000";
    access_log off;
  }

  # HTML — never cache so the new bundle URLs are always fetched
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    text/javascript
    image/svg+xml;
  gzip_min_length 1000;
}
