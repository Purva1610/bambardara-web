server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA — serve index.html for all unknown routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed JS/CSS bundles — immutable, cache forever
  location ~* \.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Images and other static media — cache for 1 year
  location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff2|woff|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000";
    access_log off;
  }

  # HTML — never cache so the new bundle URLs are always fetched
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    text/javascript
    image/svg+xml;
  gzip_min_length 1000;
}
