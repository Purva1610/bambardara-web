server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ─── Security Headers ──────────────────────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # connect-src: the Spring Boot API and the Keycloak token endpoint
  # (Direct Grant calls go straight from the browser to Keycloak). Dev-default
  # origins; update for production.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8080 http://localhost:8081; object-src 'none'; frame-ancestors 'none';" always;
  # ───────────────────────────────────────────────────────────────────────────

  # SPA fallback so client-side routes (/ceo, /login, /investment, ...) don't
  # 404 on a hard refresh or direct navigation.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed JS/CSS bundles — immutable, cache forever
  location ~* \.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Images/videos/fonts and other static media — cache for 1 year
  location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|mp4|woff2|woff|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000";
    access_log off;
  }

  # HTML — never cache so the new bundle URLs are always fetched
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    text/javascript
    image/svg+xml;
  gzip_min_length 1000;
}
