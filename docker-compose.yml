services:
  postgres:
    image: postgres:17-bookworm
    container_name: bambardara-postgres
    environment:
      POSTGRES_DB: bambardara
      POSTGRES_USER: bambardara
      POSTGRES_PASSWORD: bambardara_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambardara -d bambardara"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: