services:
  bambardarda-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Firebase credentials are baked into the JS bundle at build time.
        # Create a .env file (see .env.example) and these will be picked up
        # automatically by docker-compose.
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN}
        REACT_APP_FIREBASE_PROJECT_ID: ${REACT_APP_FIREBASE_PROJECT_ID}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${REACT_APP_FIREBASE_STORAGE_BUCKET}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID}
        REACT_APP_FIREBASE_MEASUREMENT_ID: ${REACT_APP_FIREBASE_MEASUREMENT_ID}
        # Optional: POST endpoint for the enquiry form. When unset the form
        # falls back to a pre-filled mailto: link.
        REACT_APP_ENQUIRY_ENDPOINT: ${REACT_APP_ENQUIRY_ENDPOINT:-}
    container_name: agro_tourism_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
