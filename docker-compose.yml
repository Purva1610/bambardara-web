services:
  bambardarda-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keycloak config is baked into the JS bundle at build time (Direct
        # Grant flow - see src/lib/keycloak.js). Create a .env file (see
        # .env.example) and these will be picked up automatically by
        # docker-compose.
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL:-http://localhost:8081}
        REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM:-bambardara}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID:-bambardara-web}
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
        # Optional: POST endpoint for the enquiry form. When unset the form
        # falls back to a pre-filled mailto: link.
        REACT_APP_ENQUIRY_ENDPOINT: ${REACT_APP_ENQUIRY_ENDPOINT:-}
    container_name: agro_tourism_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
